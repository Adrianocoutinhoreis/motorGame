<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 92" width="150" height="92">
  <!--
    bloco.svg — a face do bloco de madeira que o aluno empilha.

    O símbolo (número ou vogal) NÃO está aqui: ele é desenhado por cima, no
    canvas, porque muda a cada bloco e a cada nível. Assim um único arquivo
    serve aos três níveis, e o texto continua nítido em qualquer escala.
  -->
  <defs>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- corpo -->
  <rect x="3" y="3" width="144" height="86" rx="16" fill="url(#madeira)"/>

  <!-- topo iluminado: dá volume sem sombra pesada -->
  <path d="M19 3h112a16 16 0 0 1 16 16v6H3v-6A16 16 0 0 1 19 3z" fill="#F59E0B" opacity="0.55"/>

  <!-- área clara onde o símbolo é escrito, para garantir contraste -->
  <rect x="26" y="20" width="98" height="56" rx="12" fill="#FEF3C7"/>

  <!-- veios da madeira -->
  <g stroke="#92400E" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M12 34c4 6 4 12 0 18"/>
    <path d="M138 34c-4 6-4 12 0 18"/>
  </g>

  <!-- contorno -->
  <rect x="3" y="3" width="144" height="86" rx="16" fill="none" stroke="#7C2D12" stroke-width="4"/>
</svg>
