<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120">
  <!--
    gancho.svg — Roldana e Gancho Industrial do Guindaste do Motor Educandus.
    Mantém o viewBox (0 0 96 120) para alinhamento perfeito com o jogo.
  -->
  <defs>
    <!-- Gradiente Amarelo/Laranja Industrial da Roldana -->
    <linearGradient id="blocoAmarelo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Gradiente de Aço Forjado do Gancho -->
    <linearGradient id="acoForjado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="brilhoAco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <g id="guindaste-gancho">
    <!-- 1. Suporte Superior do Cabo -->
    <rect x="36" y="2" width="24" height="10" rx="3" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <circle cx="48" cy="7" r="2.5" fill="#CBD5E1"/>

    <!-- 2. Cárter Principal da Roldana (Amarelo Construção) -->
    <rect x="22" y="12" width="52" height="48" rx="9" fill="url(#blocoAmarelo)" stroke="#78350F" stroke-width="3"/>
    
    <!-- Faixas de Alerta / Segurança (Listras Pretas de Obra) -->
    <path d="M 23,45 L 36,59 H 23 Z" fill="#1E293B"/>
    <path d="M 40,59 L 56,59 L 41,43 H 26 Z" fill="#1E293B"/>
    <path d="M 60,59 L 73,59 V 45 L 61,43 Z" fill="#1E293B"/>

    <!-- Disco Central da Roldana de Aço -->
    <circle cx="48" cy="33" r="13" fill="#334155" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="48" cy="33" r="6" fill="url(#brilhoAco)"/>
    <circle cx="48" cy="33" r="2.5" fill="#0F172A"/>

    <!-- Parafusos Industriais nos Cantos -->
    <circle cx="29" cy="19" r="2.5" fill="#78350F"/>
    <circle cx="67" cy="19" r="2.5" fill="#78350F"/>

    <!-- 3. Junta de Rotação (Swivel Mount) -->
    <rect x="41" y="60" width="14" height="10" rx="3" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="39" y="68" width="18" height="6" rx="2" fill="#64748B"/>

    <!-- 4. Gancho Curvo de Aço Heavy-Duty -->
    <!-- Curva do Gancho -->
    <path d="M 48,74 
             C 48,83 45,86 36,88 
             C 22,91 22,107 36,115 
             C 50,121 66,110 65,96 
             C 64,88 56,86 52,87
             C 56,90 57,94 55,98 
             C 52,104 43,109 36,104 
             C 29,99 30,94 38,92 
             C 48,90 48,83 48,74 Z" 
          fill="url(#acoForjado)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Trava de Segurança Vermelha (Safety Latch) -->
    <path d="M 44,77 L 57,91" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="44" cy="77" r="2.5" fill="#991B1B"/>
  </g>
</svg>
