<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Caminho das Cores — atividade educativa">
<title>Caminho das Cores</title>

<!--
  ATENÇÃO — regras de independência (este jogo é publicado SOZINHO no AVA):
    · todo caminho é relativo ("./algo"), nunca "/algo" nem "http://…";
    · nada de CDN, fonte externa ou qualquer requisição de rede;
    · a pasta ./engine/ é uma CÓPIA gerada por `node tools/build.mjs` — não editar.
  Verifique antes de entregar:
    node tools/verificar-independencia.mjs caminho-das-cores
-->
<link rel="stylesheet" href="./engine/theme/tokens.css">

<!--
  Desliga o giro automático do `#palco` em celular de pé (tokens.css) SÓ
  NESTE JOGO. Esse giro existe pra jogos sempre-paisagem (1280×720, o resto
  da coleção): um celular em pé deita o conteúdo 90° pra aproveitar mais
  tela. Mas este jogo é RESPONSIVO (ver src/config.js) — em celular ele já
  escolhe um canvas VERTICAL (720×1280) de propósito, pra ficar igual ao
  brinquedo físico segurado em pé. Girar um canvas JÁ vertical deita ele de
  novo, o oposto do que o jogo quer. O resto do tokens.css continua igual;
  só essa regra é anulada, e só na própria página deste jogo.
-->
<style>
  @media (orientation: portrait) and (pointer: coarse) {
    #palco {
      width: 100vw !important;
      height: 100vh !important;
      transform: none !important;
    }
    /* A dica "GIRE O APARELHO" (mesma condição, de propósito, no tokens.css
       original) existe porque o jogo girou — aqui ele não gira, então a
       dica ficaria mentindo pro aluno que já está na posição certa. */
    #aviso-orientacao {
      display: none !important;
    }
  }
</style>

<!--
  Ícone embutido como data: URI. Sem ele, o navegador pede /favicon.ico na RAIZ
  do servidor — uma requisição para fora da pasta do jogo, que dá 404 no AVA.
  Embutido, o ícone não custa arquivo nem requisição.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='5' fill='%232563EB'/%3E%3Crect x='9' y='12' width='14' height='8' rx='3' fill='%23FFFFFF'/%3E%3C/svg%3E">
</head>
<body>

<div id="palco">
  <canvas id="jogo"></canvas>
  <div id="hud"></div>

  <div id="carregando">
    <p class="titulo">Caminho das Cores</p>
    <div class="barra"><i></i></div>
  </div>

  <div id="erro-fatal"></div>
</div>

<script type="module" src="./src/main.js"></script>

<noscript>
  <p style="padding:24px;font:700 20px system-ui">
    Este jogo precisa de JavaScript ativado para funcionar.
  </p>
</noscript>

</body>
</html>
