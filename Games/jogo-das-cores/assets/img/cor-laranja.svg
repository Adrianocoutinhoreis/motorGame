<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!--
    cor-laranja.svg — a peça laranja do Jogo das Cores.

    TEXTURA: listras diagonais.
       Seis linhas a 45 graus, preto a 26%. A diagonal é o que separa o laranja
       do amarelo quando a cor sai da conta.

    A textura NÃO é enfeite. Num jogo cujo conteúdo é a cor, cor sozinha exclui
    cerca de 1 em 12 meninos, e as oito cores desta paleta ficam quase todas na
    mesma luminância: esta é 144 em 0-255, e sete das oito caem numa faixa
    de 38 unidades. Vermelho, azul e roxo ficam a 5 unidades um do outro — em
    escala de cinza são o mesmo cinza. Ver REGRAS-JOGO-DAS-CORES.md, seção 3.2.

    Se esta peça for redesenhada, a textura tem de sobreviver, e o teste é uma
    captura do tabuleiro em escala de cinza: ela tem de continuar jogável.

    O que NÃO está aqui, de propósito:
      - a SOMBRA, que o canvas desenha por fora da peça (não caberia no viewBox);
      - o ARO DE SELEÇÃO do caminho, que é estado e não arte.
  -->
  <defs>
    <clipPath id="recorte">
      <rect width="112" height="112" rx="22"/>
    </clipPath>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- corpo -->
  <rect width="112" height="112" rx="22" fill="#F97316"/>

  <!-- textura, recortada no corpo -->
  <g clip-path="url(#recorte)">
    <g stroke="#000000" stroke-opacity="0.26" stroke-width="9.52">
      <path d="M-28 0L0 112"/>
      <path d="M0 0L28 112"/>
      <path d="M28 0L56 112"/>
      <path d="M56 0L84 112"/>
      <path d="M84 0L112 112"/>
      <path d="M112 0L140 112"/>
    </g>
  </g>

  <!-- brilho de cima: dá volume sem trocar a cor -->
  <rect width="112" height="112" rx="22" fill="url(#brilho)"/>

  <!-- contorno interno, para a peça se separar da vizinha da mesma cor -->
  <rect x="1.5" y="1.5" width="109" height="109" rx="20.5"
        fill="none" stroke="#000000" stroke-opacity="0.16" stroke-width="3"/>
</svg>
