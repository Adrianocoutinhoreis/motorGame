<!doctype html>
<meta charset="utf-8">
<title>Jogo das Cores — protótipo de layout</title>
<!--
  PROTÓTIPO DE LAYOUT, com prazo de validade declarado.

  Existe para o que nenhum teste automático julga: se a célula de 128 px dá um
  tabuleiro grande o bastante para o dedo de uma criança, e se o caminho se lê
  sobre as oito cores. E para o teste do daltonismo — a segunda cópia da tela em
  escala de cinza —, que num jogo cujo conteúdo é a cor não é acréscimo: é o que
  faz o jogo existir para quem não a distingue.

  Ele já pagou por si duas vezes:
    · descobriu que a linha do caminho, desenhada ANTES das peças, fica
      inteiramente escondida (sobram 16 px entre vizinhas);
    · mostrou que as texturas sobrevivem a 64 px, o tamanho da peça num celular.

  As PEÇAS SÃO OS SVG DE VERDADE, carregados de
  `../Games/jogo-das-cores/assets/img/cor-<nome>.svg`. A primeira versão deste
  arquivo redesenhava as texturas em canvas, e isso era uma segunda cópia da
  mesma arte — o jeito clássico de as duas divergirem sem ninguém notar. Agora
  há uma fonte só, e o que este arquivo prova vale para o que o jogo vai mostrar.

  Quando a cena de partida existir, este arquivo deve ser APAGADO: o que ele
  julga passa a ser julgado no jogo.

  Uso:  node tools/serve.mjs  ->  http://localhost:8080/tools/mock-cores.html
        (precisa de servidor: com file:// o canvas fica "tainted")
-->
<style>
  body { margin: 0; background: #0B1220; font-family: system-ui, sans-serif; }
  .rot { color: #94A3B8; font: 600 13px system-ui; padding: 10px 14px 4px; }
  canvas { display: block; border-bottom: 1px solid #1E293B; }
  #cinza { filter: grayscale(1) contrast(1.05); }
  #erro { color: #FCA5A5; font: 600 14px system-ui; padding: 14px; }
</style>

<div class="rot">1. LAYOUT — 1280×720 lógicos, célula 128 px, caminho de 5 peças selecionado</div>
<canvas id="cor" width="1280" height="720"></canvas>
<div class="rot">2. O MESMO, EM ESCALA DE CINZA — o teste do daltonismo: tem de continuar jogável</div>
<canvas id="cinza" width="1280" height="720"></canvas>
<div id="erro"></div>

<script>
// ------------------------------------------------------------------ tokens
const T = {
  vermelho: '#EF4444', laranja: '#F97316', amarelo: '#FACC15', verde: '#22C55E',
  azul: '#3B82F6', roxo: '#8B5CF6', rosa: '#EC4899', marrom: '#A16207',
};
const NOMES = Object.keys(T);
const TINTA = '#111827', SUP = '#FFFFFF', LINHA = '#E5E7EB';

// -------------------------------------------------------------- geometria
// Os números são os do PLANO-VISUAL-JOGO-DAS-CORES.md, seções 1 e 2.
const L = 1280, A = 720;
const CEL = 128, COLS = 7, LINS = 5, LADO = 112;
const MD = 20;

const BW = COLS * CEL, BH = LINS * CEL;       // 896 x 640
const BX = L - MD - BW;                        // 364
const BY = Math.round((A - BH) / 2);           // 40
const HUD_X = MD, HUD_W = BX - MD * 2;         // 20, largura 324

const IMGS = {};
const carregar = (src) => new Promise((ok, erro) => {
  const i = new Image();
  i.onload = () => ok(i);
  i.onerror = () => erro(new Error(src));
  i.src = src;
});

function peca(c, cx, cy, cor, lado = LADO) {
  c.save();
  c.shadowColor = 'rgba(17,24,39,0.28)';
  c.shadowBlur = lado * 0.09;
  c.shadowOffsetY = lado * 0.035;
  c.drawImage(IMGS[cor], cx - lado / 2, cy - lado / 2, lado, lado);
  c.restore();
}

function aro(c, cx, cy) {
  const x = cx - LADO / 2, y = cy - LADO / 2, r = 22;
  c.strokeStyle = SUP; c.lineWidth = 7;
  c.beginPath(); c.roundRect(x - 4, y - 4, LADO + 8, LADO + 8, r + 4); c.stroke();
  c.strokeStyle = TINTA; c.lineWidth = 2.5;
  c.beginPath(); c.roundRect(x - 7.5, y - 7.5, LADO + 15, LADO + 15, r + 7); c.stroke();
}

// ------------------------------------------------------------------ cena
function desenhar(c) {
  const g = c.createLinearGradient(0, 0, L, A);
  g.addColorStop(0, '#1E3A8A'); g.addColorStop(0.55, '#4338CA'); g.addColorStop(1, '#0E7490');
  c.fillStyle = g; c.fillRect(0, 0, L, A);

  // Moldura: é ela que arredonda os cantos que o original deixava VAZIOS, sem o
  // motor precisar do conceito de célula bloqueada.
  c.save();
  c.fillStyle = 'rgba(255,255,255,0.10)';
  c.beginPath(); c.roundRect(BX - 12, BY - 12, BW + 24, BH + 24, 44); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.30)'; c.lineWidth = 3;
  c.beginPath(); c.roundRect(BX - 12, BY - 12, BW + 24, BH + 24, 44); c.stroke();
  c.restore();

  const mapa = ['AVZRLXP', 'ZZVRRPM', 'RZZLVMP', 'VRZPMLL', 'MPLVZRA'];
  const cores = { A: 'amarelo', V: 'verde', Z: 'azul', R: 'vermelho', L: 'laranja', P: 'roxo', M: 'marrom', X: 'rosa' };
  const cx = (col) => BX + col * CEL + CEL / 2;
  const cy = (lin) => BY + lin * CEL + CEL / 2;

  const caminho = [[1, 0], [1, 1], [2, 1], [2, 2], [3, 2]];

  for (let lin = 0; lin < LINS; lin++) {
    for (let col = 0; col < COLS; col++) peca(c, cx(col), cy(lin), cores[mapa[lin][col]]);
  }
  for (const [l, k] of caminho) aro(c, cx(k), cy(l));

  // A linha vai POR CIMA das peças: com 16 px entre vizinhas ela ficaria toda
  // escondida embaixo delas. Contorno escuro para se ler sobre as oito cores.
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';
  const traco = () => {
    c.beginPath();
    caminho.forEach(([l, k], i) => c[i ? 'lineTo' : 'moveTo'](cx(k), cy(l)));
    c.stroke();
  };
  c.strokeStyle = 'rgba(17,24,39,0.55)'; c.lineWidth = 20; traco();
  c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 12; traco();

  // A PONTA do caminho: marca de onde ele pode crescer (a regra é "vizinha da
  // ÚLTIMA") e conta quantas peças já entraram.
  const [pl, pk] = caminho[caminho.length - 1];
  c.fillStyle = SUP; c.strokeStyle = TINTA; c.lineWidth = 4;
  c.beginPath(); c.arc(cx(pk), cy(pl), 20, 0, 7); c.fill(); c.stroke();
  c.fillStyle = TINTA; c.font = '700 22px system-ui';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(String(caminho.length), cx(pk), cy(pl) + 1);
  c.restore();

  // ------------------------------------------------------------ HUD
  const painel = (x, y, w, h, r = 16) => {
    c.save();
    c.shadowColor = 'rgba(17,24,39,0.22)'; c.shadowBlur = 12; c.shadowOffsetY = 4;
    c.fillStyle = SUP; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill();
    c.restore();
  };

  painel(HUD_X, BY, HUD_W, 44, 22);
  c.fillStyle = '#F59E0B';
  c.beginPath(); c.arc(HUD_X + 26, BY + 22, 15, 0, 7); c.fill();
  c.fillStyle = LINHA;
  c.beginPath(); c.roundRect(HUD_X + 50, BY + 14, HUD_W - 120, 16, 8); c.fill();
  c.fillStyle = '#16A34A';
  c.beginPath(); c.roundRect(HUD_X + 50, BY + 14, (HUD_W - 120) * 0.45, 16, 8); c.fill();
  c.fillStyle = TINTA; c.font = '700 22px system-ui';
  c.textAlign = 'right'; c.textBaseline = 'middle';
  c.fillText('14/30', HUD_X + HUD_W - 14, BY + 22);

  const yT = BY + 44 + MD;
  painel(HUD_X, yT, HUD_W, 44, 22);
  c.strokeStyle = '#F59E0B'; c.lineWidth = 3;
  c.beginPath(); c.arc(HUD_X + 26, yT + 22, 13, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(HUD_X + 26, yT + 14); c.lineTo(HUD_X + 26, yT + 22); c.lineTo(HUD_X + 32, yT + 22); c.stroke();
  c.fillStyle = LINHA;
  c.beginPath(); c.roundRect(HUD_X + 50, yT + 14, HUD_W - 64, 16, 8); c.fill();
  c.fillStyle = '#3B82F6';
  c.beginPath(); c.roundRect(HUD_X + 50, yT + 14, (HUD_W - 64) * 0.62, 16, 8); c.fill();

  const yB = yT + 44 + MD;
  for (let i = 0; i < 2; i++) {
    const x = HUD_X + i * (96 + MD);
    painel(x, yB, 96, 96, 24);
    c.fillStyle = TINTA;
    if (i === 0) { c.fillRect(x + 34, yB + 30, 10, 36); c.fillRect(x + 52, yB + 30, 10, 36); }
    else {
      c.beginPath(); c.moveTo(x + 34, yB + 40); c.lineTo(x + 44, yB + 40); c.lineTo(x + 56, yB + 28);
      c.lineTo(x + 56, yB + 68); c.lineTo(x + 44, yB + 56); c.lineTo(x + 34, yB + 56); c.closePath(); c.fill();
      c.strokeStyle = TINTA; c.lineWidth = 4;
      c.beginPath(); c.arc(x + 60, yB + 48, 10, -0.9, 0.9); c.stroke();
    }
  }

  // Legenda: é onde textura, cor e NOME se encontram. A amostra é o mesmo SVG.
  const yL = yB + 96 + MD;
  const alturaL = BY + BH - yL;
  painel(HUD_X, yL, HUD_W, alturaL, 20);
  c.fillStyle = '#4B5563'; c.font = '700 15px system-ui';
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('AS CORES', HUD_X + 18, yL + 22);
  const passo = (alturaL - 44) / NOMES.length;
  NOMES.forEach((nome, i) => {
    const y = yL + 40 + passo * i + passo / 2;
    const s = Math.min(34, passo - 6);
    peca(c, HUD_X + 18 + s / 2, y, nome, s);
    c.fillStyle = TINTA; c.font = '700 19px system-ui'; c.textAlign = 'left';
    c.fillText(nome.toUpperCase(), HUD_X + 18 + s + 14, y);
  });
}

(async () => {
  const base = '../Games/jogo-das-cores/assets/img/';
  for (const n of NOMES) IMGS[n] = await carregar(base + `cor-${n}.svg`);
  for (const id of ['cor', 'cinza']) desenhar(document.getElementById(id).getContext('2d'));
})().catch((e) => {
  document.getElementById('erro').textContent =
    'Não carregou ' + e.message + ' — abra por http (node tools/serve.mjs), não por file://';
});
</script>
