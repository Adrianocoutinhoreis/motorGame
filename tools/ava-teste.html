<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host de teste do AVA</title>
<!--
  ava-teste.html — simula a página do AVA que hospeda o jogo.

  Serve para provar duas coisas que NÃO dá para verificar abrindo o jogo direto:

  1. Que a mensagem JOGO_CONCLUIDO realmente SAI do <iframe>. Aberto fora de um
     iframe, `window.parent === window` e o jogo (corretamente) não envia nada —
     só registra no console. Aqui existe um pai de verdade escutando.
  2. Que o jogo se comporta em iframes de tamanhos diferentes, porque o AVA pode
     dar qualquer dimensão ao quadro.

  O painel da direita valida cada mensagem recebida contra o contrato da Parte A
  do METODO.md, item a item.
-->
<style>
  :root {
    --azul: #2563eb;
    --verde: #16a34a;
    --vermelho: #dc2626;
    --tinta: #111827;
    --suave: #6b7280;
    --linha: #e5e7eb;
    --fundo: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--tinta);
    background: var(--fundo);
    display: grid;
    grid-template-columns: 1fr 460px;
    /* Duas faixas: a barra de controles (com o seletor de jogo) e o resto. */
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  #controles strong { font-size: 16px; white-space: nowrap; }
  input[type="text"] {
    flex: 1 1 320px;
    min-width: 240px;
    padding: 9px 12px;
    border: 2px solid var(--linha);
    border-radius: 10px;
    font: inherit;
  }
  button {
    padding: 9px 14px;
    border: 2px solid var(--linha);
    border-radius: 10px;
    background: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { border-color: var(--azul); color: var(--azul); }
  button.primario { background: var(--azul); color: #fff; border-color: var(--azul); }
  button[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }

  /* ---------------------------------------------------------- seletor */
  /* Combobox com busca no lugar da antiga fileira de abas: uma aba por jogo
     não escala — já quebrava linha com 8 jogos, e a coleção só cresce. */
  .seletor { position: relative; }
  .seletor > button {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 220px;
    justify-content: space-between;
  }
  .seletor-seta { color: var(--suave); font-size: 11px; }
  .seletor-painel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 20;
    width: 320px;
    max-width: min(320px, 90vw);
    background: #fff;
    border: 2px solid var(--linha);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    padding: 8px;
  }
  .seletor-painel input[type="text"] { width: 100%; margin-bottom: 6px; }
  .seletor-lista { max-height: 320px; overflow-y: auto; }
  .seletor-grupo {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--suave);
    font-weight: 700;
    padding: 8px 8px 4px;
  }
  .seletor-grupo:first-child { padding-top: 2px; }
  .seletor-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: none;
    font: inherit;
    font-weight: 500;
    color: var(--tinta);
    cursor: pointer;
  }
  .seletor-item:hover { background: var(--fundo); }
  .seletor-item[aria-selected="true"] { background: var(--azul); color: #fff; }
  .seletor-vazio { padding: 8px; color: var(--suave); font-style: italic; font-size: 13px; }
  .aviso { font-size: 13px; color: var(--vermelho); }

  #controles {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 2px solid var(--linha);
  }
  #controles .separador {
    width: 2px;
    align-self: stretch;
    background: var(--linha);
  }

  #area {
    display: grid;
    place-items: center;
    padding: 16px;
    overflow: auto;
  }
  #moldura {
    background: #fff;
    border: 3px solid var(--tinta);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    overflow: hidden;
    resize: both;
    width: 760px;
    height: 500px;
    max-width: 100%;
  }
  #moldura iframe { display: block; width: 100%; height: 100%; border: 0; }

  aside {
    background: #fff;
    border-left: 2px solid var(--linha);
    padding: 16px;
    overflow: auto;
  }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin-bottom: 10px; }
  .msg {
    border: 2px solid var(--linha);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .msg.valida { border-color: var(--verde); }
  .msg.invalida { border-color: var(--vermelho); }
  .msg h3 { font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  pre {
    background: #0b1220;
    color: #d1fae5;
    padding: 10px;
    border-radius: 8px;
    font-size: 12.5px;
    overflow-x: auto;
  }
  ul.regras { list-style: none; margin-top: 10px; font-size: 13px; }
  ul.regras li { padding: 2px 0; }
  ul.regras li::before { content: "OK  "; color: var(--verde); font-weight: 700; }
  ul.regras li.falha::before { content: "X   "; color: var(--vermelho); }
  ul.regras li.falha { color: var(--vermelho); }
  .vazio { color: var(--suave); font-style: italic; }
  .contagem { font-weight: 700; color: var(--azul); }
</style>
</head>
<body>

<div id="controles">
  <strong>Host de teste do AVA</strong>

  <!--
    O seletor é montado em tempo de execução, a partir de `/__jogos.json` —
    servido ao vivo por `tools/serve.mjs` em dev, ou congelado no disco por
    `tools/pages-index.mjs` para o GitHub Pages. Não há lista de jogos escrita
    aqui de propósito: uma lista fixa envelheceria em silêncio e o sintoma
    seria "criei o jogo com new-game.mjs e ele não aparece".
  -->
  <div class="seletor" id="seletorJogo">
    <button type="button" id="seletorBotao" aria-haspopup="listbox" aria-expanded="false">
      <span id="seletorRotulo">Selecionar jogo…</span>
      <span class="seletor-seta" aria-hidden="true">▾</span>
    </button>
    <div class="seletor-painel" id="seletorPainel" hidden>
      <input type="text" id="seletorBusca" placeholder="Buscar jogo…"
             aria-label="Buscar jogo" autocomplete="off">
      <div class="seletor-lista" id="seletorLista" role="listbox" aria-label="Jogos"></div>
    </div>
  </div>
  <span class="aviso" id="aviso"></span>

  <span class="separador"></span>
  <input type="text" id="caminho" value="../Games/jogo-dos-blocos/index.html"
         aria-label="Caminho do jogo em teste">
  <button class="primario" id="carregar">Carregar</button>
  <span class="separador"></span>
  <button data-tam="400x700">Celular</button>
  <button data-tam="640x480">Pequeno</button>
  <button data-tam="760x500" aria-pressed="true">Médio</button>
  <button data-tam="1280x720">Grande</button>
  <span class="separador"></span>
  <button id="limpar">Limpar registro</button>
</div>

<div id="area">
  <div id="moldura"><iframe id="quadro" title="Jogo em teste"></iframe></div>
</div>

<aside>
  <h2>Mensagens recebidas (<span class="contagem" id="total">0</span>)</h2>
  <div id="registro"><p class="vazio">Jogue uma partida até o fim. A mensagem aparece aqui.</p></div>
</aside>

<script>
  const quadro = document.getElementById('quadro');
  const moldura = document.getElementById('moldura');
  const registro = document.getElementById('registro');
  const total = document.getElementById('total');
  const caminho = document.getElementById('caminho');

  let recebidas = 0;

  function carregar() {
    quadro.src = caminho.value;
    atualizarRotulo();
  }

  document.getElementById('carregar').addEventListener('click', carregar);
  caminho.addEventListener('keydown', (e) => { if (e.key === 'Enter') carregar(); });

  /* ----------------------------------------------------------- o seletor */

  const seletorJogo = document.getElementById('seletorJogo');
  const seletorBotao = document.getElementById('seletorBotao');
  const seletorRotulo = document.getElementById('seletorRotulo');
  const seletorPainel = document.getElementById('seletorPainel');
  const seletorBusca = document.getElementById('seletorBusca');
  const seletorLista = document.getElementById('seletorLista');
  const avisoEl = document.getElementById('aviso');

  let jogosCarregados = []; // { dir, slug, titulo }

  // `dir` carrega o caminho inteiro da pasta (ex.: `numerandus/jogo-da-memoria`).
  // O primeiro segmento é a COLEÇÃO; jogo direto (sem "/") cai no grupo "Jogos".
  function grupoDoJogo(jogo) {
    const [antes, depois] = jogo.dir.split('/');
    if (!depois) return 'Jogos';
    return antes.charAt(0).toUpperCase() + antes.slice(1);
  }

  function urlDoJogo(jogo) {
    // Relativo à página (que está em /tools/), como o valor inicial do campo:
    // assim o host funciona igual se o projeto for servido sob um prefixo.
    return `../Games/${jogo.dir}/index.html`;
  }

  function abrirSeletor() {
    seletorPainel.hidden = false;
    seletorBotao.setAttribute('aria-expanded', 'true');
    seletorBusca.value = '';
    renderizarLista('');
    seletorBusca.focus();
  }

  function fecharSeletor() {
    seletorPainel.hidden = true;
    seletorBotao.setAttribute('aria-expanded', 'false');
  }

  seletorBotao.addEventListener('click', () => {
    if (seletorPainel.hidden) abrirSeletor(); else fecharSeletor();
  });
  seletorBusca.addEventListener('input', () => renderizarLista(seletorBusca.value));
  document.addEventListener('click', (e) => {
    if (!seletorPainel.hidden && !seletorJogo.contains(e.target)) fecharSeletor();
  });
  seletorJogo.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { fecharSeletor(); seletorBotao.focus(); }
  });

  /**
   * Redesenha a lista filtrada por texto, agrupada por coleção.
   *
   * Refeita a cada tecla — a lista é pequena o bastante (dezenas de jogos, não
   * milhares) para não precisar de nada mais esperto que um filtro na hora.
   */
  function renderizarLista(filtro) {
    const alvo = filtro.trim().toLocaleLowerCase('pt-BR');
    const atual = quadro.getAttribute('src') ?? '';
    const porGrupo = new Map();
    for (const jogo of jogosCarregados) {
      if (alvo && !jogo.titulo.toLocaleLowerCase('pt-BR').includes(alvo)) continue;
      const grupo = grupoDoJogo(jogo);
      if (!porGrupo.has(grupo)) porGrupo.set(grupo, []);
      porGrupo.get(grupo).push(jogo);
    }

    seletorLista.innerHTML = '';
    const grupos = [...porGrupo.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    if (!grupos.length) {
      const vazio = document.createElement('p');
      vazio.className = 'seletor-vazio';
      vazio.textContent = jogosCarregados.length ? 'nenhum jogo encontrado' : 'nenhum jogo disponível';
      seletorLista.append(vazio);
      return;
    }

    for (const grupo of grupos) {
      const titulo = document.createElement('div');
      titulo.className = 'seletor-grupo';
      titulo.textContent = grupo;
      seletorLista.append(titulo);

      for (const jogo of porGrupo.get(grupo)) {
        const url = urlDoJogo(jogo);
        const botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'seletor-item';
        botao.setAttribute('role', 'option');
        botao.setAttribute('aria-selected', String(url === atual));
        botao.textContent = jogo.titulo;
        botao.title = jogo.slug; // o slug é o que vai no campo `jogo` do AVA
        botao.addEventListener('click', () => {
          caminho.value = url;
          carregar();
          fecharSeletor();
        });
        seletorLista.append(botao);
      }
    }
  }

  /**
   * Mostra no botão fechado o título do jogo carregado — e o próprio caminho
   * se ele não corresponder a nenhum jogo conhecido (um caminho digitado à
   * mão, uma build em `dist/`, uma cópia do teste-entrega-avulsa). Mentir
   * aqui mostrando o último jogo da lista seria pior que mostrar o caminho cru.
   */
  function atualizarRotulo() {
    const atual = quadro.getAttribute('src') ?? '';
    const jogo = jogosCarregados.find((j) => urlDoJogo(j) === atual);
    seletorRotulo.textContent = jogo ? jogo.titulo : (atual || 'Selecionar jogo…');
  }

  function avisar(texto) {
    avisoEl.textContent = texto;
  }

  /**
   * Descobre os jogos por DUAS vias independentes, e é de propósito.
   *
   * A primeira versão só conhecia `/__jogos.json` (a rota do `tools/serve.mjs`).
   * Isso deixava o seletor vazio para quem abre a página pela **Live Server da
   * IDE**, que é um estático puro: ela serve o jogo perfeitamente e não tem rota
   * nenhuma. O host respondia com um aviso mandando reiniciar um servidor que
   * nem estava em uso — conselho errado, dado com convicção.
   *
   *  1. **`/__jogos.json`** — vivo, do `serve.mjs`, ou estático, congelado por
   *     `pages-index.mjs` para o GitHub Pages. Traz slug e título prontos.
   *  2. **A listagem de `../Games/`** — qualquer estático que liste diretório
   *     (Live Server, `http-server`, nginx com autoindex — o GitHub Pages NÃO
   *     lista). Os slugs saem dos links, e o título de cada um sai do
   *     `<title>` do próprio `index.html`.
   *
   * A regra do que É um jogo é a MESMA das duas vias, e a mesma do servidor:
   * subpasta de `Games/` **que tenha um `index.html`**, OU — sem `index.html`
   * próprio — uma pasta de COLEÇÃO cujas subpastas SÃO jogos (um nível de
   * aninhamento, ex.: `Games/numerandus/jogo-da-velha-novo/`). Na via 2 isso é
   * verificado buscando o arquivo — pasta sem ele, nos dois níveis, não vira
   * opção no seletor.
   */
  async function descobrirJogos() {
    // 1ª via: a rota do serve.mjs.
    try {
      const resposta = await fetch('../__jogos.json');
      if (resposta.ok) return { jogos: await resposta.json(), via: '/__jogos.json' };
    } catch {
      // Sem rota aqui: a listagem ainda pode existir. Segue para a 2ª via.
    }

    // 2ª via: a listagem de diretório (Live Server, http-server, autoindex).
    const linksDe = async (url) => {
      const resposta = await fetch(url);
      if (!resposta.ok) return null;
      const doc = new DOMParser().parseFromString(await resposta.text(), 'text/html');
      const rotaDeItem = new RegExp('([^/?#]+)/?$');
      return [...new Set(
        [...doc.querySelectorAll('a[href]')]
          .map((a) => a.getAttribute('href').match(rotaDeItem)?.[1])
          // Sem ponto no nome: link para ARQUIVO não é pasta.
          .filter((nome) => nome && !nome.includes('.')),
      )];
    };

    const topo = await linksDe('../Games/');
    if (!topo) throw new Error('sem /__jogos.json e sem listagem de ../Games/');

    const candidatos = []; // { dir }
    for (const nome of topo) {
      const indiceDireto = await fetch(`../Games/${nome}/index.html`);
      if (indiceDireto.ok) {
        candidatos.push({ dir: nome });
        continue;
      }
      // Sem index.html direto: talvez seja uma pasta de coleção.
      const subitens = await linksDe(`../Games/${nome}/`);
      for (const sub of subitens ?? []) {
        const indiceAninhado = await fetch(`../Games/${nome}/${sub}/index.html`);
        if (indiceAninhado.ok) candidatos.push({ dir: `${nome}/${sub}` });
      }
    }

    const jogos = [];
    for (const { dir } of candidatos) {
      let html;
      try {
        const indice = await fetch(`../Games/${dir}/index.html`);
        if (!indice.ok) continue; // pasta sem index.html não é jogo publicável
        html = await indice.text();
      } catch {
        continue;
      }
      const titulo = html.match(new RegExp('<title>([^<]*)</title>', 'i'))?.[1]?.trim();

      // O slug ESTÁVEL do AVA sai do texto de src/config.js, não do caminho da
      // pasta — os dois só coincidem para um jogo direto (ver `slugDoJogo` em
      // tools/serve.mjs, mesma ideia).
      let slug = dir;
      try {
        const configResp = await fetch(`../Games/${dir}/src/config.js`);
        if (configResp.ok) {
          const config = await configResp.text();
          slug = config.match(/slug:\s*'([^']+)'/)?.[1] ?? dir;
        }
      } catch { /* sem config legível: usa o caminho como aproximação */ }

      jogos.push({ dir, slug, titulo: titulo || dir });
    }
    jogos.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));
    return { jogos, via: 'listagem de ../Games/' };
  }

  /**
   * Carrega os jogos conhecidos no seletor. Falhar aqui não pode derrubar o
   * host: o campo de caminho continua funcionando, então o aviso é discreto e
   * nomeia **o que foi tentado** — não um palpite sobre a causa.
   */
  async function montarSeletor() {
    let achado;
    try {
      achado = await descobrirJogos();
    } catch (err) {
      avisar(`não deu para descobrir os jogos: ${err.message} — use o campo de caminho`);
      console.warn('[host AVA] descoberta de jogos falhou:', err);
      return;
    }

    if (!achado.jogos.length) {
      avisar('nenhum jogo em Games/ (nenhuma subpasta com index.html)');
      return;
    }

    jogosCarregados = achado.jogos;
    atualizarRotulo();
    console.log(`[host AVA] ${achado.jogos.length} jogo(s) via ${achado.via}`);
  }

  for (const botao of document.querySelectorAll('[data-tam]')) {
    botao.addEventListener('click', () => {
      const [l, a] = botao.dataset.tam.split('x');
      moldura.style.width = l + 'px';
      moldura.style.height = a + 'px';
      for (const outro of document.querySelectorAll('[data-tam]')) {
        outro.setAttribute('aria-pressed', String(outro === botao));
      }
    });
  }

  document.getElementById('limpar').addEventListener('click', () => {
    recebidas = 0;
    total.textContent = '0';
    registro.innerHTML = '<p class="vazio">Registro limpo.</p>';
  });

  /**
   * Valida a mensagem contra o contrato (METODO.md, Parte A, checklist A5).
   * Cada item é uma regra que, se falhar, quebra o registro no AVA.
   */
  function validar(dados) {
    const ehNumero = (v) => typeof v === 'number' && Number.isFinite(v);
    const proibidos = ['lo_id', 'activity_id', 'aluno', 'aluno_id', 'turma', 'xp', 'nota'];

    return [
      { regra: 'type é exatamente "JOGO_CONCLUIDO"', ok: dados.type === 'JOGO_CONCLUIDO' },
      { regra: 'acertos é number', ok: ehNumero(dados.acertos) },
      { regra: 'erros é number', ok: ehNumero(dados.erros) },
      { regra: 'totalPerguntas é number', ok: ehNumero(dados.totalPerguntas) },
      { regra: 'nivel presente e não nulo', ok: dados.nivel !== null && dados.nivel !== undefined },
      { regra: 'jogo tem slug estável', ok: typeof dados.jogo === 'string' && dados.jogo.length > 0 },
      { regra: 'acertos <= totalPerguntas', ok: !ehNumero(dados.totalPerguntas) || dados.acertos <= dados.totalPerguntas },
      { regra: 'não envia dado do aluno nem do AVA', ok: !proibidos.some((c) => c in dados) },
    ];
  }

  window.addEventListener('message', (evento) => {
    let dados = evento.data;
    // O AVA tolera a mensagem serializada; aceitamos aqui para refletir isso.
    if (typeof dados === 'string') {
      try { dados = JSON.parse(dados); } catch { return; }
    }
    if (!dados || typeof dados !== 'object') return;
    if (dados.type !== 'JOGO_CONCLUIDO') return;

    recebidas++;
    total.textContent = String(recebidas);

    const regras = validar(dados);
    const valida = regras.every((r) => r.ok);

    if (recebidas === 1) registro.innerHTML = '';

    const bloco = document.createElement('div');
    bloco.className = 'msg ' + (valida ? 'valida' : 'invalida');
    bloco.innerHTML = `
      <h3><span>Partida #${recebidas}</span><span>${new Date().toLocaleTimeString('pt-BR')}</span></h3>
      <pre>${JSON.stringify(dados, null, 2)}</pre>
      <ul class="regras">
        ${regras.map((r) => `<li class="${r.ok ? '' : 'falha'}">${r.regra}</li>`).join('')}
      </ul>
    `;
    registro.prepend(bloco);

    console.log('[host AVA] recebida:', dados, valida ? 'CONTRATO OK' : 'CONTRATO COM FALHA');
  });

  carregar();
  montarSeletor();
</script>
</body>
</html>
